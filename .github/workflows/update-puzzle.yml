name: Update daily puzzle

on:
  schedule:
    # Every day at 00:05 UTC (Lichess daily puzzle)
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Lichess daily puzzle
        run: node fetch-puzzle.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add puzzle-data.js
          if git diff --staged --quiet; then
            echo "Puzzle already up to date."
          else
            git commit -m "chore: update daily chess puzzle"
            git push
          fi
